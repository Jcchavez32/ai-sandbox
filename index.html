<!DOCTYPE html>
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Sandbox</title>
  <style>
    body {
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      max-width: 640px;
      margin: 60px auto;
      padding: 0 16px;
      line-height: 1.6;
      color: #222;
      background: #fafafa;
    }
    h1 { margin-bottom: 0.3em; }
    button {
      font-size: 1rem;
      padding: 10px 18px;
      border: none;
      border-radius: 6px;
      background: #2563eb;
      color: #fff;
      cursor: pointer;
    }
    button:hover { background: #1d4ed8; }
    #date { margin-top: 16px; font-size: 1.1rem; font-weight: 600; }
  </style>
</head>
<body>
  <h1>AI Sandbox</h1>
  <p>
    This is my practice space for learning GitHub and AI agents. I'm using it to
    experiment, make mistakes, and build up the skills to create simple, useful
    tools for small businesses and households.
  </p>

  <button id="showDate">Show today's date</button>
  <p id="date"></p>

  <script>
    document.getElementById("showDate").addEventListener("click", function () {
      var today = new Date().toLocaleDateString(undefined, {
        weekday: "long", year: "numeric", month: "long", day: "numeric"
      });
      document.getElementById("date").textContent = "Today is " + today;
    });
  </script>
</body>
</html>
